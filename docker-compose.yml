# ==============================================================================
# LOCAL DEVELOPMENT ONLY - DO NOT USE FOR PRODUCTION DEPLOYMENT
# Production is hosted exclusively on Render via render.yaml and managed PostgreSQL.
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_business_architect_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-32-chars-long-abc}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_insecure_local}@db:5432/${POSTGRES_DB:-ai_business_architect}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - SESSION_HTTPS_ONLY=false
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ai_business_architect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_insecure_local}
      POSTGRES_DB: ${POSTGRES_DB:-ai_business_architect}
    ports:
      # Bound strictly to 127.0.0.1 loopback for local development security
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_business_architect}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

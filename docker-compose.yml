services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_business_architect_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key-32-chars-long-abc}
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/ai_business_architect
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SESSION_HTTPS_ONLY=false
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ai_business_architect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_business_architect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_business_architect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
